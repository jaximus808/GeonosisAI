# TDM-81: Fly app for the Claude connector (apps/mcp). Deploy from the REPO ROOT (the image needs the
# lockfile and packages/env):
#
#   fly apps create rdf-mcp            # once; pick another name if taken, then change `app` and MCP_PUBLIC_URL
#   fly secrets set --config apps/mcp/fly.toml MCP_TOKEN=... RDF_OPERATOR_PASSCODE=... \
#       SPACETIME_TOKEN=... ORCHESTRATOR_URL=https://<orchestrator app>.fly.dev
#   fly deploy . --config apps/mcp/fly.toml --dockerfile apps/mcp/Dockerfile --ignorefile apps/mcp/Dockerfile.dockerignore
#
# Env reference: docs/connector.md. Secrets never go in this file.
app = "rdf-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  ignorefile = "Dockerfile.dockerignore"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # Must be the exact origin users paste into claude.ai (the OAuth issuer and the token audience).
  MCP_PUBLIC_URL = "https://rdf-mcp.fly.dev"
  SPACETIME_HOST = "https://maincloud.spacetimedb.com"
  SPACETIME_DB_NAME = "robo-factory-a706j"
  MCP_MAX_SPEND_CENTS = "50000"

[http_service]
  internal_port = 8080
  force_https = true
  # claude.ai gives discovery/token endpoints 10 s; keep one machine warm instead of cold-starting.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
