<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="gx-pad gx-stack">
  <div class="gx-row">
    <button class="gx-btn gx-btn-primary" type="button">Ship checkpoint</button>
    <button class="gx-btn" type="button">View report</button>
    <button class="gx-btn gx-btn-ghost" type="button">Cancel ticket</button>

  </div>
  <div class="gx-row">
    <button class="gx-btn gx-btn-primary" type="button" disabled>Start training</button>
    <span class="gx-small">Waiting for 8 accepted episodes (7 so far)</span>
  </div>
</div>
</body>
