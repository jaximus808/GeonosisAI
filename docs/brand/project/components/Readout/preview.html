<!-- @dsCard group="Data" height=260 width=520 subtitle="Success rate with Wilson 95% interval and target" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Readout</title></head>
<body>
<div class="gx-pad gx-stack" style="gap: var(--space-6);">
  <div class="gx-readout">
    <div class="gx-readout-top"><span class="gx-label">Baseline · pi05-base</span><span class="gx-id">n=10</span></div>
    <div class="gx-readout-num">30%<small>3/10 · 11–60%</small></div>
    <div class="gx-track" role="img" aria-label="30 percent, interval 11 to 60 percent, target 80 percent">
      <div class="gx-track-ci" style="left: 11%; width: 49%;"></div>
      <div class="gx-track-point" style="left: 30%;"></div>
      <div class="gx-track-target" style="left: 80%;"></div>
    </div>
  </div>
  <div class="gx-readout">
    <div class="gx-readout-top"><span class="gx-label">Iteration 2 · pi05-cup-bin-it2</span><span class="gx-id">n=10</span></div>
    <div class="gx-readout-num">90%<small>9/10 · 60–98%</small></div>
    <div class="gx-track" role="img" aria-label="90 percent, interval 60 to 98 percent, target 80 percent">
      <div class="gx-track-ci is-pass" style="left: 60%; width: 38%;"></div>
      <div class="gx-track-point" style="left: 90%;"></div>
      <div class="gx-track-target" style="left: 80%;"></div>
    </div>
    <div class="gx-trials" aria-label="Trials">
      <i class="gx-trial is-pass">P</i><i class="gx-trial is-pass">P</i><i class="gx-trial is-pass">P</i><i class="gx-trial is-fail">F</i><i class="gx-trial is-pass">P</i><i class="gx-trial is-pass">P</i><i class="gx-trial is-pass">P</i><i class="gx-trial is-pass">P</i><i class="gx-trial is-pass">P</i><i class="gx-trial is-pass">P</i>
    </div>
  </div>
</div>
</body>
</html>
