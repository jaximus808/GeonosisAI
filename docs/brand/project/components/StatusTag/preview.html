<!-- @dsCard group="Status" height=112 subtitle="One tag per ticket status" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusTag</title></head>
<body>
<div class="gx-pad gx-stack">
  <div class="gx-row" style="gap: var(--space-2);">
    <span class="gx-tag"><i class="gx-rivet"></i>Queued</span>
    <span class="gx-tag gx-tag-running"><i class="gx-rivet"></i>Baseline</span>
    <span class="gx-tag gx-tag-running"><i class="gx-rivet"></i>Diagnose</span>
    <span class="gx-tag gx-tag-running"><i class="gx-rivet"></i>Collect</span>
    <span class="gx-tag gx-tag-running"><i class="gx-rivet"></i>Eval</span>
    <span class="gx-tag gx-tag-shipped"><i class="gx-rivet"></i>Shipped</span>
    <span class="gx-tag gx-tag-failed"><i class="gx-rivet"></i>Failed</span>
    <span class="gx-tag gx-tag-cancelled"><i class="gx-rivet"></i>Cancelled</span>
  </div>
  <div class="gx-row" style="gap: var(--space-2);">
    <span class="gx-tag gx-tag-money"><i class="gx-rivet"></i>Purchased</span>
    <span class="gx-tag"><i class="gx-rivet"></i>Sleeping</span>
  </div>
</div>
</body>
</html>
