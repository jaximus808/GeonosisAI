<!-- @dsCard group="Marketplace" height=300 width=390 subtitle="A paid task on a contributor's phone" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TaskCard</title></head>
<body>
<div class="gx-pad">
  <article class="gx-task">
    <div class="gx-row" style="justify-content: space-between;">
      <span class="gx-tag gx-tag-money"><i class="gx-rivet"></i>Recovery takeover</span>
      <span class="gx-price">$3.50</span>
    </div>
    <h2 class="gx-task-title">Catch the cup at the bin rim</h2>
    <p style="margin: 0;">The robot drives. When it pauses at the bin, you take over and finish the drop.</p>
    <div class="gx-facts"><span>About 90 s</span><span>yam-01</span><span>3 of 8 left</span></div>
    <button class="gx-btn gx-btn-primary gx-btn-block" type="button">Claim task</button>
  </article>
</div>
</body>
</html>
