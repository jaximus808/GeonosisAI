# [SIM] demo reviewer config (scripts/demo/run.py -> RDF_REVIEW_CONFIG). Identical to production
# services/orchestrator/config/review.yaml except fixtures.allow (the MuJoCo robot's episodes are
# fixture:true, so they are checked on their merits instead of refused) and frame_drops.max_ratio (TDM-86:
# the sim's cameras and its recording ticks run on the demo laptop, which renders them at whatever rate it
# can: 7-10% short at normal load and 73% short (8 of 30 fps) with several agents building on it. That is
# the renderer's fault, not the contributor's, and it rejected clean phone demos, so on [SIM] episodes
# only a nearly empty recording fails this check). Claude vision stays ON.
version: 1

duration:
  min_s: 2.0          # shorter is not a demonstration
  max_s: 120.0        # longer is a stuck or forgotten recording
  tolerance_s: 0.5    # episode.duration_ms vs the actions parquet's timestamp span

frame_drops:
  max_ratio: 0.9      # [SIM] (production 0.02): reject at >= 90% missing ticks or rendered sim-camera frames
  max_frame_count_mismatch: 2   # episode.frame_count vs rows in the parquet

jerk:
  # RMS joint jerk in rad/s^3, Savitzky-Golay cubic third derivative over `window` ticks at the
  # recording fps (30 Hz). Calibrated on the TDM-25 synthetic fixtures with YAM-like encoder noise:
  # smooth min-jerk demo 4.7, 2 mrad 4-7 Hz tremor 13, 10 mrad tremor 60, 20 mrad tremor 120.
  # A fast smooth move (1 rad in 1 s) peaks near 60 but its episode RMS stays well below.
  # RE-TUNE on the first real YAM recordings (print metrics_json.jerk for a few good demos).
  max_rms_rad_s3: 60.0
  window: 9

takeover:
  kinds: [recovery_takeover]
  min_pre_takeover_s: 0.5            # policy-failure frames that must precede takeover_ts (cut by the Data Droid)
  min_takeover_s: 1.0                # shortest human segment worth paying for
  ts_tolerance_s: 0.5                # takeover/handback may sit this far outside the recorded span
  min_control_source_agreement: 0.9  # control_source must agree with the timestamps on >= 90% of frames

success:
  required_kinds: [clean_teleop, recovery_takeover, purchased]

fixtures:
  allow: true         # [SIM] demo: MuJoCo episodes carry fixture:true (sim, never real-robot data)

claude:
  enabled: true
  model: claude-opus-5-5
  effort: high
  frames: 3           # keyframes sent per episode (from the preferred camera)
  frame_width: 512
