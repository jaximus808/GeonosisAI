[project]
name = "rdf-common"
version = "0.0.0"
description = "Shared code for the Python services: fail-fast settings loaders"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic-settings>=2.4"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdf_common"]
