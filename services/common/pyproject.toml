[project]
name = "rdf-common"
version = "0.0.0"
description = "Shared code for the Python services: fail-fast settings loaders, SpacetimeDB client"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic-settings>=2.4", "httpx>=0.27", "websockets>=13",
    # TDM-25 episode actions format + reviewer checks (rdf_common.episode_format / review_checks)
    "numpy>=1.26", "pyarrow>=16", "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdf_common"]
