[project]
name = "rdf-factory"
version = "0.0.0"
description = "Factory Droid session management (onboarding, data, training Droids)"
requires-python = ">=3.11,<3.12"
dependencies = ["rdf-common"]

[project.scripts]
rdf-factory = "rdf_factory.__main__:main"

[tool.uv.sources]
rdf-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdf_factory"]
