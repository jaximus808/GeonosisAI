[project]
name = "rdf-factory"
version = "0.0.0"
description = "Factory Droid session management (onboarding, data, training Droids)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rdf-common",
    # TDM-30: local droids (droid exec subprocess) + Factory Sessions API (httpx comes with rdf-common)
    "droid-sdk>=0.5,<0.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rdf-factory = "rdf_factory.__main__:main"

[tool.uv.sources]
rdf-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdf_factory"]
