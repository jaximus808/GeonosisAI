[project]
name = "rdf-orchestrator"
version = "0.0.0"
description = "Planner and reviewer loops, dispatcher; writes decisions to the event log"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rdf-common",
    # TDM-4 episode media store: signed-URL API + backends
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "boto3>=1.35",
    "websockets>=13",
    "anthropic>=2.3.0",
    "rdf-payments",  # TDM-63 Stripe test-mode payouts
    "modal>=1.6.0",
    "rdf-factory",  # TDM-27 resume bridge -> TDM-30 FactoryClient.resume
    "pywebpush>=2.0",  # TDM-65 web push (VAPID) paging
    "rdf-training",  # TDM-42 checkpoint registry + Modal cost (rdf_training.registry / cost)
    "pillow>=10.3",  # TDM-108 job-drop share cards
    "qrcode>=7.4",  # TDM-108 QR code on the card
]

[project.scripts]
rdf-orchestrator = "rdf_orchestrator.__main__:main"

[tool.uv.sources]
rdf-common = { path = "../common", editable = true }
rdf-payments = { path = "../payments", editable = true }
rdf-factory = { path = "../factory", editable = true }
rdf-training = { path = "../training", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rdf_orchestrator"]
