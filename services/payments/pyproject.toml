[project]
name = "rdf-payments"
version = "0.0.0"
description = "Stripe Connect test-mode payouts (contributors and dataset sellers). TEST MODE ONLY."
requires-python = ">=3.11,<3.12"
dependencies = [
    "rdf-common",
    "stripe==16.0.0",
    "python-dotenv>=1.0",
]

[project.scripts]
rdf-payments-smoke = "rdf_payments.smoke_test:cli"

[tool.uv.sources]
rdf-common = { path = "../common", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdf_payments"]
