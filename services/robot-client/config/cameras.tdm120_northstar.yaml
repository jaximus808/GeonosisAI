# TDM-120: camera rig for the northstar Jetson (docs/jetson-inventory.md section 3). Read by
# rdf_robot_client.cameras via RDF_CAMERAS_CONFIG (set in config/tdm118_northstar.env).
# RealSense colour over plain V4L2 (UVC): no pyrealsense2 wheel exists for cp311/aarch64, so we use the
# kernel's uvcvideo nodes. RealSense colour is YUYV (no MJPG); every camera here sits on the 5 Gbps hub.
# Devices are by-path (they follow the USB port; the RealSense USB serial in by-id differs from its real serial).
#   top   = vrteleop "exo"    D435 SN 420222071940, port 1-1.1.3; colour = the RGB module, UVC interface 3.
#   wrist = vrteleop "wristR" D405 SN 353322271521, port 1-1.1.2 (right arm; can_right).
# VERIFY with vrteleop stopped: scripts/jetson/remote/tdm120_camera_probe.sh lists each node's formats and
# prints the colour (YUYV) node per camera. The wrist index (video-index4) is a guess until then.
reference: top
pair_tolerance_ms: 40      # 15 fps -> 67 ms frame period; 40 ms keeps pairs honest without starving
buffer_seconds: 1.0
policy_size: 224
stream: {width: 640, jpeg_quality: 70, fps: 15}   # browser feed: 640 px, ~25-35 KiB/frame per camera

cameras:
  top:
    source: v4l2
    device: /dev/v4l/by-path/platform-3610000.usb-usb-0:1.1.3:1.3-video-index0
    width: 640
    height: 480
    fps: 15
    fourcc: YUYV
    rotate: 0
    flip: none
    timestamps: auto
  wrist:
    source: v4l2
    device: /dev/v4l/by-path/platform-3610000.usb-usb-0:1.1.2:1.0-video-index4
    width: 640
    height: 480
    fps: 15
    fourcc: YUYV
    rotate: 0
    flip: none
    timestamps: auto
