[project]
name = "rdf-training"
version = "0.0.0"
description = "Episode conversion to LeRobot format, pi0.5 fine-tune, checkpoint export, policy serving"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
rdf-training = "rdf_training.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdf_training"]
