[project]
name = "rdf-training"
version = "0.0.0"
description = "Episode conversion to LeRobot format, pi0.5 fine-tune, checkpoint export, policy serving"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rdf-common", "modal>=1.6.0",
    # TDM-39 LeRobot conversion (rdf_training.convert): parquet + mp4 decode/encode, no torch/lerobot
    "numpy>=1.26", "pyarrow>=16", "av>=14.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
rdf-training = "rdf_training.__main__:main"

[tool.uv.sources]
rdf-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdf_training"]
